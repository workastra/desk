---
name: Code Quality Checks

on:
  pull_request:
  push:
    branches:
      - v0

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yaml-lint:
    runs-on: ubuntu-24.04
    name: YAML Lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml --format github --strict .

  hadolint:
    runs-on: ubuntu-24.04
    name: Hadolint
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          recursive: true
          format: sarif
          output-file: ${{ runner.temp }}/hadolint.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v4.36.0
        with:
          sarif_file: ${{ runner.temp }}/hadolint.sarif
          category: Hadolint

  codebase-lint:
    runs-on: ubuntu-24.04
    name: Codebase Lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Formatting
        run: pnpm run fmt --check
      - name: Run Linter
        run: pnpm run lint
      - name: Run Doctor
        run: pnpm run doctor --annotations
      - name: Run TypeScript Compiler
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-24.04
    name: Test
    needs:
      - yaml-lint
      - codebase-lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          NEXT_PUBLIC_APP_VERSION=development
          APP_URL=http://localhost:3000
          IAM_EXTERNAL_ISSUER_URL=http://localhost:9000
          IAM_INTERNAL_ISSUER_URL=http://localhost:9000
          IAM_TLS_SKIP_VERIFY=true
          IAM_OAUTH_CLIENT_ID=workastra-desk
          LOCK_MODE=in-memory
          EOF
      - name: Run Tests
        run: pnpm run test

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs:
      - yaml-lint
      - codebase-lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Build
        uses: docker/build-push-action@v7.2.0
        with:
          push: false
