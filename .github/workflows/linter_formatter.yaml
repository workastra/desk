---
name: Code Quality Checks

on:
  pull_request:
  push:
    branches:
      - v0

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yaml-lint:
    runs-on: ubuntu-24.04
    name: YAML Lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml --format github --strict .

  codebase-lint:
    runs-on: ubuntu-24.04
    name: Codebase Lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Formatting
        run: pnpm run fmt --check
      - name: Run Linter
        run: pnpm run lint
      - name: Run Doctor
        run: pnpm run doctor --annotations
      - name: Run TypeScript Compiler
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-24.04
    name: Test
    needs:
      - yaml-lint
      - codebase-lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          NEXT_PUBLIC_APP_VERSION=development
          APP_URL=http://localhost:3000
          IAM_EXTERNAL_ISSUER_URL=http://localhost:9000
          IAM_INTERNAL_ISSUER_URL=http://localhost:9000
          IAM_TLS_SKIP_VERIFY=true
          IAM_OAUTH_CLIENT_ID=workastra-desk
          LOCK_MODE=in-memory
          EOF
      - name: Run Tests
        run: pnpm run test

  build:
    runs-on: ubuntu-24.04
    name: Build
    needs:
      - yaml-lint
      - codebase-lint
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Environment
        run: mv .env.template .env
      - name: Build Project
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: true
